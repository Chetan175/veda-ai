services:
  mongodb:
    image: mongo:7.0
    container_name: veda-ai-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: veda_ai
    volumes:
      - mongodb_data:/data/db
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: veda-ai-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: veda-ai-api
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      API_PORT: 4000
      CLIENT_ORIGIN: http://localhost:3000
      MONGODB_URI: mongodb://mongodb:27017/veda_ai
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: gpt-4o-mini
      JWT_SECRET: dev-secret-key-change-in-production
      DEMO_MODE: false
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app/server
      - ./shared:/app/shared
      - ./node_modules:/app/node_modules
    command: npm run dev:api

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: development
    container_name: veda-ai-web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api
    volumes:
      - ./web:/app/web
      - ./shared:/app/shared
      - ./node_modules:/app/node_modules
    command: npm run dev:web

volumes:
  mongodb_data:
  redis_data:

networks:
  default:
    name: veda-ai-network
